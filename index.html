<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Error Book App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
body{
  background-color:#0a0a0a;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g fill='none' stroke='%234ade80' stroke-opacity='0.16' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 20c0-5 5-10 10-10s10 5 10 10-5 10-10 10-10-5-10-10z'/></g></svg>");
  background-size:220px 220px;background-repeat:repeat;background-attachment:fixed;color:#e2e8f0;
  padding:8px;padding-top:82px;font-size:13px;overflow-x:hidden;min-height:100vh;
}

/* === TOP STRIP — ERROR BOOK APP + DARK BOLD BORDER === */
.topstrip{
  position:fixed;top:0;left:0;right:0;
  background:rgba(15,23,42,0.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:3px solid #0a0a0a;   /* dark bold border */
  box-shadow:0 4px 0 #000, 0 6px 18px rgba(0,0,0,0.8);
  z-index:200;
  display:flex;flex-direction:column;
  padding:4px 6px 6px;
  margin:6px 6px 0;                   /* margin so border visible around */
  border-radius:10px 10px 0 0;
}
.app-title{
  text-align:center;
  font-size:15px;font-weight:900;letter-spacing:2px;
  color:#fbbf24;
  text-shadow:0 0 6px rgba(251,191,36,0.5), 0 1px 0 #000;
  padding:4px 0 2px;
  border-bottom:2px solid #1e293b;
  margin-bottom:4px;
}
.topstrip-row{
  display:flex;gap:3px;align-items:center;
  padding:2px 0 0;
}
.topstrip button{
  flex:1;padding:0 3px;height:34px;font-size:10px;font-weight:700;
  border-radius:8px;border:none;display:inline-flex;align-items:center;
  justify-content:center;gap:3px;color:#94a3b8;
  background:rgba(30,41,59,0.85);cursor:pointer;white-space:nowrap;overflow:hidden;
}
.topstrip button i{font-size:12px}
.topstrip button.active{color:#fff}
.topstrip button[data-tab="all"].active{background:#0ea5e9}
.topstrip button[data-tab="weekly"].active{background:#16a34a}
.topstrip button[data-tab="monthly"].active{background:#f59e0b;color:#000}
.topstrip button[data-tab="settings"]{flex:0 0 36px;background:rgba(30,41,59,0.85);color:#94a3b8}
.topstrip button[data-tab="settings"].active{background:#475569;color:#fff}

.card{background:rgba(30,41,59,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:10px;padding:8px;margin-bottom:8px;border:1px solid rgba(71,85,105,0.7);box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.hidden{display:none!important}
.empty{text-align:center;color:#cbd5e1;padding:24px 12px;font-size:12px}

.upload-grid{display:flex;flex-direction:column;gap:6px}
.upbox{
  position:relative;
  background:rgba(15,23,42,0.72);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:2px dashed #475569;
  border-radius:12px;
  padding:10px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  overflow:hidden;
  min-height:154px;
  height:154px;
  box-sizing:border-box;
}
.upbox.filled{border-style:solid;border-color:#0ea5e9;padding:0;min-height:auto;height:auto}
.upbox img{width:100%;display:block;border-radius:10px;max-height:180px;object-fit:contain;background:#000}
.upbox .edit-ov{position:absolute;top:6px;right:6px;z-index:3}
.upbox .edit-ov button{width:28px;height:28px;padding:0;font-size:12px;border-radius:8px;background:rgba(220,38,38,0.92);color:#fff;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.upbox .box-lbl{
  font-size:10px;color:#cbd5e1;font-weight:800;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:5px;height:14px;line-height:14px;
}
.upbox .box-lbl i{font-size:11px;color:#94a3b8}
.upbox .box-actions{display:flex;gap:8px;width:100%;max-width:240px}
.upbox .mini-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:0;border-radius:10px;border:1.5px solid rgba(71,85,105,0.85);
  background:rgba(15,23,42,0.9);color:#e2e8f0;font-size:9.5px;font-weight:800;letter-spacing:.5px;
  cursor:pointer;height:62px;min-height:62px;box-sizing:border-box;
}
.upbox .mini-btn i{font-size:19px;line-height:19px;height:19px;display:block}
.upbox .mini-btn span{display:block;line-height:10px;height:10px}
.upbox .mini-btn.cam i{color:#22c55e}
.upbox .mini-btn.gal i{color:#0ea5e9}

.save-btn{
  width:100%;padding:0;font-size:15px;font-weight:800;letter-spacing:1.2px;
  background:#0ea5e9;color:#fff;border:none;border-radius:10px;margin-top:8px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  height:42px;min-height:42px;box-sizing:border-box;
}
.save-btn i{font-size:16px}

.mistake{position:relative;background:rgba(30,41,59,0.85);backdrop-filter:blur(14px);border:1.5px solid rgba(15,23,42,0.95);border-radius:10px;padding:8px;margin-bottom:8px;box-shadow:0 4px 16px rgba(0,0,0,0.45);touch-action:pan-y;overflow:hidden}
.mistake img.preview{width:100%;border-radius:8px;margin-top:5px;height:180px;min-height:180px;max-height:180px;object-fit:contain;background:#000;cursor:zoom-in;pointer-events:auto}
.mistake img.preview:first-child{margin-top:0}

.mistake .fire-overlay,.folder .fire-overlay{position:absolute;inset:0;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .08s;z-index:5;background:radial-gradient(circle at center,rgba(220,38,38,0.85) 0%,rgba(153,27,27,0.6) 40%,rgba(80,10,10,0.3) 70%,transparent 100%);box-shadow:inset 0 0 30px rgba(239,68,68,0.9),inset 0 0 60px rgba(220,38,38,0.5),0 0 40px rgba(239,68,68,0.7)}
.mistake.swiping,.folder.swiping{z-index:10}
@keyframes fireBurst{0%{transform:scale(1);opacity:.9}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1.35);opacity:0}}
.mistake.fire-burst::after,.folder.fire-burst::after{content:'';position:absolute;inset:0;border-radius:10px;background:radial-gradient(circle,rgba(239,68,68,0.9),transparent 70%);animation:fireBurst .45s ease-out forwards;pointer-events:none;z-index:6}
.mistake.slide-out-left,.folder.slide-out-left{transition:transform .35s cubic-bezier(.4,0,.6,1),opacity .35s;transform:translateX(-120%) !important;opacity:0}

.ans-toggle-btn{
  width:100%;margin-top:6px;padding:0;background:rgba(15,23,42,0.95);
  border:1.5px solid rgba(15,23,42,1);border-radius:8px;color:#e2e8f0;font-size:11px;font-weight:800;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:space-between;gap:8px;
  letter-spacing:.3px;height:34px;min-height:34px;padding-left:10px;padding-right:10px;box-sizing:border-box;
}
.ans-toggle-btn i{font-size:12px;color:#cbd5e1}
.ans-toggle-btn .ans-left{display:inline-flex;align-items:center;gap:6px}
.ans-toggle-btn .ans-qnum{color:#fbbf24;font-weight:900;font-size:12px;letter-spacing:.8px;text-shadow:0 0 6px rgba(251,191,36,0.35)}
.ans-toggle-btn .ans-label{display:inline-flex;align-items:center;gap:5px;color:#cbd5e1;font-weight:800}
.ans-wrap{display:none;margin-top:6px}
.ans-wrap.show{display:block}

.folder{position:relative;background:rgba(30,41,59,0.82);backdrop-filter:blur(14px);border-radius:10px;margin-bottom:8px;border:1px solid rgba(71,85,105,0.7);overflow:hidden;touch-action:pan-y;cursor:pointer;min-height:56px;box-sizing:border-box}
.folder.locked{border:1.5px solid #22c55e;box-shadow:0 0 12px rgba(34,197,94,0.35)}
.folder-head{display:flex;align-items:center;gap:8px;padding:10px;min-height:56px;box-sizing:border-box}
.folder-head .ic{font-size:16px;flex-shrink:0}
.folder-head .info{flex:1}
.folder-head .ttl{font-size:12px;font-weight:700;color:#e2e8f0;display:flex;align-items:center;gap:6px;min-height:14px}
.folder-head .ttl .lock{color:#22c55e;font-size:10px}
.folder-head .sub{font-size:10px;color:#cbd5e1;margin-top:1px;min-height:12px}
.folder-head .cnt{background:#0ea5e9;color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;min-width:28px;text-align:center;box-sizing:border-box;height:20px;line-height:16px}
.folder.locked .cnt{background:#22c55e}
.folder-head .chev{color:#94a3b8;font-size:12px;flex-shrink:0}

.set-row{display:flex;gap:6px;width:100%;margin-bottom:8px}
.set-btn{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:5px;padding:10px 4px;background:rgba(30,41,59,0.82);backdrop-filter:blur(14px);border-radius:10px;border:1px solid rgba(71,85,105,0.7);cursor:pointer;color:#e2e8f0;font-size:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap;user-select:none}
.set-btn i{font-size:13px;color:#0ea5e9}
.set-btn.danger i{color:#dc2626}
.set-btn.danger{color:#f87171}

.store-btn{width:100%;display:flex;flex-direction:row;align-items:center;gap:8px;padding:12px;background:rgba(30,41,59,0.82);backdrop-filter:blur(14px);border-radius:10px;border:1px solid rgba(71,85,105,0.7);cursor:pointer;color:#e2e8f0;font-size:13px;font-weight:700}
.store-btn .ic{width:34px;height:34px;border-radius:9px;background:rgba(15,23,42,0.85);display:flex;align-items:center;justify-content:center;color:#0ea5e9;font-size:15px;flex-shrink:0}
.store-btn .txt{flex:1}
.store-btn .txt small{display:block;color:#cbd5e1;font-size:10px;font-weight:400;margin-top:2px}
.store-btn .chev{color:#94a3b8;font-size:12px}

/* ================= CROP ================= */
.crop-c{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;padding:8px}
.crop-area{
  flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#111;border-radius:8px;touch-action:none;
  border-top:2px solid #fbbf24;
  border-bottom:2px solid #fbbf24;
}
.crop-inner{
  position:absolute;left:0;right:0;top:0;bottom:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.crop-area img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  pointer-events:none;
  transform-origin:center center;
  position:relative;
  z-index:1;
  display:block;
}
.crop-ov{
  position:absolute;border:2px dashed #0ea5e9;background:rgba(14,165,233,.15);
  box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;transform-origin:center center;
  z-index:2;
}

.crop-h{
  position:absolute;width:22px;height:22px;
  background:#0ea5e9;border:2px solid #fff;border-radius:50%;
  cursor:pointer;z-index:6;touch-action:none;
  box-shadow:0 0 10px rgba(14,165,233,0.9);
}
.crop-h::before{
  content:'';position:absolute;top:50%;left:50%;
  width:64px;height:64px;transform:translate(-50%,-50%);
  border-radius:50%;
}
.crop-h.tr{ top:-11px; right:-11px; }
.crop-h.br{ bottom:-11px; right:-11px; }

.crop-rot-h{
  position:absolute;width:28px;height:28px;
  background:#fbbf24;border:2px solid #fff;border-radius:50%;
  cursor:grab;display:flex;align-items:center;justify-content:center;
  z-index:6;touch-action:none;
  box-shadow:0 0 12px rgba(251,191,36,0.95);
}
.crop-rot-h::before{
  content:'';position:absolute;top:50%;left:50%;
  width:70px;height:70px;transform:translate(-50%,-50%);
  border-radius:50%;
}
.crop-rot-h.tl{ top:-14px; left:-14px; }
.crop-rot-h.bl{ bottom:-14px; left:-14px; }
.crop-rot-h i{ font-size:11px; color:#0a0a0a; pointer-events:none; }

.crop-btns{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:0 6px}
.crop-round{padding:0;border:none;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.crop-cancel{width:52px;height:52px;background:#dc2626;font-size:20px;box-shadow:0 4px 14px rgba(220,38,38,0.5)}
.crop-confirm{width:52px;height:52px;background:#16a34a;font-size:22px;box-shadow:0 4px 14px rgba(22,163,74,0.5)}
.crop-rotate{width:42px;height:42px;background:#0ea5e9;font-size:17px;box-shadow:0 4px 12px rgba(14,165,233,0.5)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(22,163,74,0.98);color:#fff;padding:8px 16px;border-radius:12px;font-size:12px;font-weight:700;z-index:4000;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.err{background:rgba(220,38,38,0.98)}

.reminder{background:linear-gradient(135deg,rgba(124,45,18,0.95),rgba(153,27,27,0.95));border-radius:10px;padding:7px 9px;margin-bottom:8px;display:flex;align-items:center;gap:8px;border:1px solid #f59e0b}
.reminder .msg{flex:1;font-size:11px;color:#fef3c7}
.reminder .msg b{color:#fbbf24}
.reminder button{width:30px;height:30px;padding:0;font-size:12px;border-radius:7px;background:#f59e0b;color:#000;border:none;cursor:pointer}

.folder-detail{position:fixed;inset:0;background:#0a0a0a;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g fill='none' stroke='%234ade80' stroke-opacity='0.16' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 20c0-5 5-10 10-10s10 5 10 10-5 10-10 10-10-5-10-10z'/></g></svg>");background-size:220px 220px;background-attachment:fixed;z-index:500;display:none;flex-direction:column;padding:8px;padding-top:52px;overflow-y:auto}
.folder-detail.show{display:flex}
.fd-header{position:sticky;top:0;background:rgba(15,23,42,0.95);backdrop-filter:blur(14px);padding:8px;border-radius:10px;display:flex;align-items:center;gap:8px;margin-bottom:8px;z-index:10;border:1px solid rgba(71,85,105,0.7)}
.fd-back{width:36px;height:36px;padding:0;font-size:15px;border-radius:9px;background:#475569;color:#fff;border:none;cursor:pointer}
.fd-title{flex:1;font-size:13px;font-weight:800;color:#38bdf8;display:flex;align-items:center;gap:6px}
.fd-count{background:#0ea5e9;color:#fff;font-size:10px;padding:3px 10px;border-radius:20px;font-weight:800}
.fd-body{padding-bottom:20px}

.fs-viewer{position:fixed;inset:0;background:#000;z-index:3000;display:none;flex-direction:column}
.fs-viewer.show{display:flex}
.fs-top{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,0.75),transparent);pointer-events:none}
.fs-top > *{pointer-events:auto}
.fs-counter{color:#fff;font-size:12px;font-weight:700;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:20px}
.fs-close{width:36px;height:36px;padding:0;font-size:16px;border-radius:50%;background:rgba(30,41,59,0.9);border:none;color:#fff;cursor:pointer}
.fs-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.fs-img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;transform-origin:center center}
.fs-label{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#e2e8f0;font-size:11px;font-weight:700;background:rgba(15,23,42,0.85);padding:6px 14px;border-radius:20px;white-space:nowrap}
.fs-qnum{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;font-weight:800;background:rgba(15,23,42,0.85);padding:5px 14px;border-radius:20px;z-index:10;border:1px solid rgba(71,85,105,0.7)}
.fs-next-btn{position:absolute;bottom:22px;right:18px;height:44px;padding:0 18px;background:#0ea5e9;color:#fff;border:none;border-radius:22px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;cursor:pointer;z-index:20}
#fsDoneBtn{background:linear-gradient(135deg,#0a0a0a,#1a2a3a);color:#fbbf24;border:2px solid #fbbf24;font-weight:900;box-shadow:0 0 12px rgba(251,191,36,0.6),inset 0 0 12px rgba(251,191,36,0.15)}
.fs-preview-btn{position:absolute;bottom:22px;left:18px;height:44px;padding:0 16px;background:#16a34a;color:#fff;border:none;border-radius:22px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;cursor:pointer;z-index:20}
.fs-preview-btn:disabled{background:#475569;color:#94a3b8;opacity:.6}

.cam-view{position:fixed;inset:0;background:#000;z-index:2800;display:none;flex-direction:column}
.cam-view.show{display:flex}
.cam-top-bar{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#000;z-index:5;flex-shrink:0}
.cam-top-bar button{width:40px;height:40px;padding:0;font-size:16px;border-radius:50%;border:none;cursor:pointer;background:rgba(30,41,59,0.85);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.cam-title{font-size:12px;color:#e2e8f0;font-weight:800;letter-spacing:1px;background:rgba(30,41,59,0.6);padding:6px 14px;border-radius:20px}
.cam-strip{flex:1;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.cam-stream-wrap{position:relative;width:100%;height:100%;overflow:hidden;border-top:2px solid #fbbf24;border-bottom:2px solid #fbbf24;box-sizing:border-box}
#camVideo{width:100%;height:100%;object-fit:cover;background:#000;transform-origin:center center;image-rendering:high-quality}
.cam-zoom-wrap{position:relative;padding:8px 14px;background:#000;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:6}
.cam-zoom-slider{flex:1;position:relative;height:44px;display:flex;align-items:center}
.cam-zoom-slider input[type="range"]{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:rgba(71,85,105,0.9);border-radius:3px;outline:none;cursor:pointer}
.cam-zoom-slider input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:#fbbf24;border:3px solid #0a0a0a;box-shadow:0 0 10px rgba(251,191,36,0.6);cursor:pointer}
.cam-zoom-slider input[type="range"]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fbbf24;border:3px solid #0a0a0a;box-shadow:0 0 10px rgba(251,191,36,0.6);cursor:pointer}
.cam-zoom-wrap .zoom-val{font-size:11px;font-weight:900;color:#fbbf24;min-width:40px;text-align:center}
.cam-zoom-wrap i{color:#cbd5e1;font-size:13px}
.cam-bottom-bar{position:relative;display:flex;justify-content:center;align-items:center;gap:34px;padding:14px 14px 18px;background:#000;flex-shrink:0;z-index:6}
.cam-btn{background:none;border:none;padding:0;cursor:pointer;color:#fff}
.cam-shutter{width:82px;height:82px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,0.45);box-shadow:0 0 0 2px rgba(0,0,0,0.35),0 6px 18px rgba(0,0,0,0.5);position:relative}
.cam-shutter::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#dc2626}
.cam-flip{width:48px;height:48px;border-radius:50%;background:rgba(30,41,59,0.85);border:2px solid rgba(71,85,105,0.8);font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.cam-flip i{color:#0ea5e9}
.cam-flash{width:48px;height:48px;border-radius:50%;background:rgba(30,41,59,0.85);border:2px solid rgba(71,85,105,0.8);font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.cam-flash i{color:#94a3b8}
.cam-flash.on{background:rgba(251,191,36,0.2);border-color:#fbbf24;box-shadow:0 0 14px rgba(251,191,36,0.6)}
.cam-flash.on i{color:#fbbf24}
.cam-flash:disabled{opacity:.35}
.cam-focus-ring{position:absolute;width:80px;height:80px;border:2px solid #fbbf24;border-radius:50%;pointer-events:none;z-index:6;opacity:0;transform:translate(-50%,-50%) scale(1.3);transition:opacity .25s,transform .25s}

@keyframes skeletonShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

  background-size: 200% 100%; animation: skeletonShimmer 1.6s ease-in-out infinite; border-radius: 8px;
}
@keyframes smoothFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.smooth-in { animation: smoothFadeIn 0.55s cubic-bezier(.16,1,.3,1) both; }

<script>
/* 1) DATA */
let store = { today:[], weekly:[], monthly:[], store:[], lastDayCheck:"" };
try {
  const saved = JSON.parse(localStorage.getItem('mockStore') || 'null');
  if (saved && typeof saved === 'object') store = Object.assign(store, saved);
} catch(e){}
if(!Array.isArray(store.today)) store.today = [];
if(!Array.isArray(store.weekly)) store.weekly = [];
if(!Array.isArray(store.monthly)) store.monthly = [];
if(!Array.isArray(store.store)) store.store = [];
if(!store.lastDayCheck) store.lastDayCheck = "";
function saveStore(){ localStorage.setItem('mockStore', JSON.stringify(store)); }

/* 2) DATE */
function ymd(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`; }
function todayKey(){ return ymd(new Date()); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(d){ const n=['January','February','March','April','May','June','July','August','September','October','November','December'];return n[d.getMonth()]+' '+d.getFullYear(); }
function weekStart(d){ const c=new Date(d);const day=c.getDay();const diff=(day===0?-6:1-day);c.setDate(c.getDate()+diff);c.setHours(0,0,0,0);return c; }
function weekLabel(start){ const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const e=new Date(start);e.setDate(e.getDate()+6);return `${start.getDate()} ${m[start.getMonth()]} - ${e.getDate()} ${m[e.getMonth()]}`; }

/* 3) STATE */
let pImgQ=null, pImgMy=null, pImgC=null;
let cropTarget=null;
let cBox={x:0,y:0,w:200,h:150};
let dragging=false, resizing=false, resizeCorner='br', dStart={x:0,y:0}, bStart={x:0,y:0,w:0,h:0};
let currentFolder = null;
let cropBoxRotation = 0;
let cropImgRotation = 0;
let rotatingBox = false;
let rotateStartAngle = 0;
let rotateStartRotation = 0;
let boxCenter = { x: 0, y: 0 };

/* 4) UTIL */
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',1800)}
function getSortedList(items){ return [...items].sort((a,b) => new Date(b.date) - new Date(a.date)); }

/* 5) TABS */
function showTab(n){
  ['all','weekly','monthly','settings'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==n);
    const btn=document.querySelector(`.topstrip button[data-tab="${t}"]`);
    if(btn) btn.classList.toggle('active', t===n);
  });
  const fd = document.getElementById('folderDetail');
  if(fd) fd.classList.remove('show');
  currentFolder = null;
  if(n==='all') renderAll();
  if(n==='weekly') renderWeekly();
  if(n==='monthly') renderMonthly();
  if(n==='settings') updateStoreCount();
  scrollTo(0,0);
}

/* 6) CAMERA */
let camStream = null;
let camFacing = 'environment';
let camTarget = null;
let camReady = false;
let camTrack = null;
let camCapabilities = null;
let camSettings = null;
let currentZoom = 1;
let flashOn = false;
let upgradingToHD = false;

async function openCamera(target){
  camTarget = target; cropTarget = target;
  const titleMap = {q:'QUESTION CAMERA', my:'MY SOLUTION CAMERA', c:'CORRECT SOLUTION CAMERA'};
  document.getElementById('camTitle').textContent = titleMap[target] || 'CAMERA';
  document.getElementById('camView').classList.add('show');
  resetZoomUI(); flashOn = false; updateFlashBtn();
  await startCameraFast();
}
async function startCameraFast(){
  const video = document.getElementById('camVideo');
  camReady = false;
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; camTrack = null; }
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: camFacing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    video.srcObject = camStream;
    video.setAttribute('playsinline','');
    video.muted = true;
    await new Promise(resolve => { if(video.readyState >= 1) resolve(); else video.onloadedmetadata = () => resolve(); });
    await video.play();
    camTrack = camStream.getVideoTracks()[0];
    camCapabilities = camTrack.getCapabilities ? camTrack.getCapabilities() : {};
    camSettings = camTrack.getSettings ? camTrack.getSettings() : {};
    try{
      const adv = [];
      if(camCapabilities.focusMode && camCapabilities.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
      if(camCapabilities.exposureMode && camCapabilities.exposureMode.includes('continuous')) adv.push({ exposureMode: 'continuous' });
      if(adv.length) await camTrack.applyConstraints({ advanced: adv });
    } catch(e){}
    setupZoomRange(); updateFlashBtn(); bindTapToFocus();
    camReady = true;
    setTimeout(() => silentUpgradeHD(), 1500);
  } catch(err){ console.warn('Camera error:', err); }
}
async function silentUpgradeHD(){
  if(upgradingToHD || !camTrack) return;
  upgradingToHD = true;
  try{
    const caps = camCapabilities || {};
    const targetW = Math.min(3840, (caps.width && caps.width.max) || 3840);
    const targetH = Math.min(2160, (caps.height && caps.height.max) || 2160);
    await camTrack.applyConstraints({ width: { ideal: targetW }, height: { ideal: targetH } });
    camSettings = camTrack.getSettings ? camTrack.getSettings() : {};
    try{
      const adv = [];
      if(camCapabilities.focusMode && camCapabilities.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
      if(adv.length) await camTrack.applyConstraints({ advanced: adv });
    } catch(e){}
    setupZoomRange(); updateFlashBtn();
  } catch(e){}
  upgradingToHD = false;
}
function bindTapToFocus(){
  const wrap = document.getElementById('camStreamWrap');
  if(!wrap) return;
  wrap.onclick = async (e) => {
    if(!camTrack || !camCapabilities || !camCapabilities.pointsOfInterest) return;
    const rect = wrap.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const ring = document.getElementById('camFocusRing');
    ring.style.left = (e.clientX - rect.left) + 'px';
    ring.style.top = (e.clientY - rect.top) + 'px';
    ring.classList.add('show');
    setTimeout(() => ring.classList.remove('show'), 800);
    try{
      await camTrack.applyConstraints({ advanced: [{ pointsOfInterest: [{ x, y }], focusMode: 'single-shot' }]});
      setTimeout(() => { camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{}); }, 1000);
    } catch(e){}
  };
}
function setupZoomRange(){
  const zoomInput = document.getElementById('camZoom');
  if(camCapabilities && camCapabilities.zoom){
    const min = camCapabilities.zoom.min || 1;
    const max = camCapabilities.zoom.max || 5;
    const step = camCapabilities.zoom.step || 0.1;
    zoomInput.min = min; zoomInput.max = max; zoomInput.step = step;
    zoomInput.value = min; currentZoom = min;
    updateZoomVal(min);
  } else {
    zoomInput.min = 1; zoomInput.max = 5; zoomInput.step = 0.1;
    zoomInput.value = 1; currentZoom = 1;
    updateZoomVal(1);
  }
}

  flashOn = !flashOn;

  catch(e){ flashOn = !flashOn; updateFlashBtn(); }

async function capturePhoto(){
  if(!camReady){ toast('Please wait a moment', 1); return; }
  const wrap = document.getElementById('camStreamWrap');
  if(wrap){ wrap.style.background = '#fff'; setTimeout(() => { wrap.style.background = 'transparent'; }, 120); }
  let url = null;
  if(window.ImageCapture && camTrack){
    try{
      const imageCapture = new ImageCapture(camTrack);
      const blob = await imageCapture.takePhoto();
      url = await blobToDataURL(blob);
    } catch(e){}
  }
  if(!url) url = captureViaCanvas();
  if(!url){ toast('Capture failed', 1); return; }
  closeCamera();
  const img = document.getElementById('cropImg');
  img.src = url;
  img.onload = () => {
    document.getElementById('cropModal').classList.remove('hidden');
    setTimeout(initCrop, 120);
  };
  cropTarget = camTarget;
}
function captureViaCanvas(){
  const video = document.getElementById('camVideo');
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return null;
  const canvas = document.createElement('canvas');
  canvas.width = vw; canvas.height = vh;
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  let sx=0, sy=0, sw=vw, sh=vh;
  if(currentZoom > 1 && !(camCapabilities && camCapabilities.zoom)){
    sw = Math.round(vw / currentZoom); sh = Math.round(vh / currentZoom);
    sx = Math.round((vw - sw) / 2); sy = Math.round((vh - sh) / 2);
  }
  if(camFacing === 'user'){ ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, vw, vh);
  return canvas.toDataURL('image/png');
}
function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob);
  });
}

/* 8) CROP — image center, ratio preserved, no upscale */
function initCrop(){
  cropBoxRotation = 0;
  cropImgRotation = 0;

  const img = document.getElementById('cropImg');
  img.style.transition = '';
  img.style.transform = '';
  img.style.width = '';
  img.style.height = '';
  img.style.maxWidth = '';
  img.style.maxHeight = '';

  const box = document.getElementById('cropBox');
  box.style.transition = ''; box.style.transform = '';
  const a = document.getElementById('cropInner').getBoundingClientRect();
  // Crop box center-aligned
  const bw = a.width * 0.84;
  const bh = a.height * 0.5;
  cBox = { x: (a.width - bw) / 2, y: (a.height - bh) / 2, w: bw, h: bh };
  updateBox();
}
function updateBox(){
  const b = document.getElementById('cropBox');
  b.style.left = cBox.x + 'px';
  b.style.top = cBox.y + 'px';
  b.style.width = cBox.w + 'px';
  b.style.height = cBox.h + 'px';
}
(function bindCropBox(){
  const boxEl = document.getElementById('cropBox');
  boxEl.addEventListener('mousedown', handleCropStart);
  boxEl.addEventListener('touchstart', handleCropStart, {passive:false});
})();

function handleCropStart(e){
  const target = e.target;
  if(target.classList.contains('crop-h') || target.closest('.crop-h')){
    const el = target.classList.contains('crop-h') ? target : target.closest('.crop-h');
    const corner = el.dataset.corner || 'br';
    startResizeCorner(e, corner);
    return;
  }
  if(target.classList.contains('crop-rot-h') || target.closest('.crop-rot-h')){
    const rotEl = target.classList.contains('crop-rot-h') ? target : target.closest('.crop-rot-h');
    const rotCorner = rotEl.dataset.rotcorner || 'bl';
    startRotateCorner(e, rotCorner);
    return;
  }
  startDrag(e);
}

function startDrag(e){
  dragging = true;
  const t = e.touches ? e.touches[0] : e;
  dStart = { x: t.clientX, y: t.clientY };
  bStart = { x: cBox.x, y: cBox.y, w: cBox.w, h: cBox.h };
  e.preventDefault();
}

function startResizeCorner(e, corner){
  resizing = true;
  resizeCorner = corner;
  const t = e.touches ? e.touches[0] : e;
  dStart = { x: t.clientX, y: t.clientY };
  bStart = { x: cBox.x, y: cBox.y, w: cBox.w, h: cBox.h };
  e.preventDefault();
  e.stopPropagation();
}

function startRotateCorner(e, corner){
  rotatingBox = true;
  const t = e.touches ? e.touches[0] : e;
  const boxEl = document.getElementById('cropBox');
  const rect = boxEl.getBoundingClientRect();
  boxCenter.x = rect.left + rect.width / 2;
  boxCenter.y = rect.top + rect.height / 2;
  rotateStartAngle = Math.atan2(t.clientY - boxCenter.y, t.clientX - boxCenter.x) * 180 / Math.PI;
  rotateStartRotation = cropBoxRotation;
  e.preventDefault();
  e.stopPropagation();
}

document.addEventListener('mousemove', onMove);
document.addEventListener('touchmove', onMove, { passive:false });
document.addEventListener('mouseup', stopMove);
document.addEventListener('touchend', stopMove);

function onMove(e){
  if(rotatingBox){
    const t = e.touches ? e.touches[0] : e;
    const angle = Math.atan2(t.clientY - boxCenter.y, t.clientX - boxCenter.x) * 180 / Math.PI;
    const delta = angle - rotateStartAngle;
    cropBoxRotation = ((rotateStartRotation + delta) % 360 + 360) % 360;
    const box = document.getElementById('cropBox');
    box.style.transition = 'none';
    box.style.transform = `rotate(${cropBoxRotation}deg)`;
    e.preventDefault();
    return;
  }
  if(resizing){
    const t = e.touches ? e.touches[0] : e;
    const a = document.getElementById('cropInner').getBoundingClientRect();
    const dx = t.clientX - dStart.x;
    const dy = t.clientY - dStart.y;

    if(resizeCorner === 'br'){
      cBox.w = Math.max(60, Math.min(a.width - cBox.x, bStart.w + dx));
      cBox.h = Math.max(60, Math.min(a.height - cBox.y, bStart.h + dy));
    } else if(resizeCorner === 'tr'){
      let newW = Math.max(60, Math.min(a.width - cBox.x, bStart.w + dx));
      let newY = bStart.y + dy;
      let newH = bStart.h - dy;
      if(newY < 0){ newH += newY; newY = 0; }
      if(newY + newH > a.height){ newH = a.height - newY; }
      newH = Math.max(60, newH);
      cBox.w = newW;
      cBox.y = newY;
      cBox.h = newH;
    }
    updateBox();
    e.preventDefault();
    return;
  }
  if(dragging){
    const t = e.touches ? e.touches[0] : e;
    const a = document.getElementById('cropInner').getBoundingClientRect();
    const dx = t.clientX - dStart.x;
    const dy = t.clientY - dStart.y;
    cBox.x = Math.max(0, Math.min(a.width - cBox.w, bStart.x + dx));
    cBox.y = Math.max(0, Math.min(a.height - cBox.h, bStart.y + dy));
    updateBox();
    e.preventDefault();
  }
}

function stopMove(){
  if(rotatingBox){
    rotatingBox = false;
    const box = document.getElementById('cropBox');
    box.style.transition = 'transform .15s';
  }
  dragging = false;
  resizing = false;
}

/* BIG ROUND ROTATE BUTTON — IMAGE 90° CLOCKWISE */
function rotateCropBox90(){
  cropImgRotation = (cropImgRotation + 90) % 360;

  const img = document.getElementById('cropImg');
  img.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1)';
  img.style.transform = `rotate(${cropImgRotation}deg)`;

  setTimeout(fitImageAfterRotation, 360);
}

/* Rotation ke baad image center, ratio same, no upscale */
function fitImageAfterRotation(){
  const img = document.getElementById('cropImg');
  const area = document.getElementById('cropInner');
  const areaRect = area.getBoundingClientRect();
  const natW = img.naturalWidth;
  const natH = img.naturalHeight;
  if(!natW || !natH) return;

  const rot = ((cropImgRotation % 360) + 360) % 360;
  const swap = (rot === 90 || rot === 270);
  const effW = swap ? natH : natW;
  const effH = swap ? natW : natH;

  // Sirf tab scale karo jab image area se badi ho (downscale only)
  let scale = 1;
  if(effW > areaRect.width || effH > areaRect.height){
    scale = Math.min(areaRect.width / effW, areaRect.height / effH);
  }

  const dispW = effW * scale;
  const dispH = effH * scale;

  img.style.maxWidth = 'none';
  img.style.maxHeight = 'none';
  img.style.width = dispW + 'px';
  img.style.height = dispH + 'px';
  img.style.transform = `rotate(${cropImgRotation}deg)`;

  // Crop box center-aligned reset
  const bw = areaRect.width * 0.84;
  const bh = areaRect.height * 0.5;
  cBox = { x: (areaRect.width - bw) / 2, y: (areaRect.height - bh) / 2, w: bw, h: bh };
  updateBox();
}

function applyCrop(){
  const img = document.getElementById('cropImg');
  const imgRect = img.getBoundingClientRect();
  const natW = img.naturalWidth, natH = img.naturalHeight;

  const rot = ((cropImgRotation % 360) + 360) % 360;
  const swap = (rot === 90 || rot === 270);
  const effW = swap ? natH : natW;
  const effH = swap ? natW : natH;

  const boxEl = document.getElementById('cropBox');
  const boxRect = boxEl.getBoundingClientRect();
  const boxCenterX = boxRect.left + boxRect.width / 2;
  const boxCenterY = boxRect.top + boxRect.height / 2;

  const outW = Math.max(1, Math.round(cBox.w * (effW / imgRect.width)));
  const outH = Math.max(1, Math.round(cBox.h * (effH / imgRect.height)));

  const c = document.createElement('canvas');
  c.width = outW; c.height = outH;
  const ctx = c.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const scaleX = effW / imgRect.width;
  const scaleY = effH / imgRect.height;
  const bCx = (boxCenterX - imgRect.left) * scaleX;
  const bCy = (boxCenterY - imgRect.top) * scaleY;

  ctx.translate(outW / 2, outH / 2);
  ctx.rotate(-cropBoxRotation * Math.PI / 180);
  ctx.rotate(-cropImgRotation * Math.PI / 180);

  const srcCx = natW / 2;
  const srcCy = natH / 2;

  const offX = bCx - effW / 2;
  const offY = bCy - effH / 2;

  const rad = cropImgRotation * Math.PI / 180;
  const offRotX = offX * Math.cos(-rad) - offY * Math.sin(-rad);
  const offRotY = offX * Math.sin(-rad) + offY * Math.cos(-rad);

  ctx.drawImage(
    img,
    srcCx - offRotX - natW / 2,
    srcCy - offRotY - natH / 2,
    natW,
    natH
  );

  const url = c.toDataURL('image/jpeg', 0.95);
  setBoxImage(cropTarget, url);
  closeCrop();
  toast('Cropped');
}

/* 9) FOLDERS */
function getCurrentWeekFolder(){
  const now = new Date();
  const ws = weekStart(now);
  const we = new Date(ws); we.setDate(we.getDate() + 6);
  const wsKey = ymd(ws), weKey = ymd(we);
  let wf = store.weekly.find(w => w.weekStart === wsKey);
  if(!wf){
    wf = { weekStart: wsKey, weekEnd: weKey, label: weekLabel(ws), items: [], locked: true };
    store.weekly.unshift(wf);
    store.weekly.sort((a,b) => b.weekStart.localeCompare(a.weekStart));
  }
  if(!wf.locked) wf.locked = true;
  if(!Array.isArray(wf.items)) wf.items = [];
  return wf;
}
function getCurrentMonthFolder(){
  const now = new Date();
  const mKey = monthKey(now);
  let mf = store.monthly.find(m => m.monthKey === mKey);
  if(!mf){
    mf = { monthKey: mKey, label: monthLabel(now), weeks: [], items: [], locked: true };
    store.monthly.unshift(mf);
    store.monthly.sort((a,b) => b.monthKey.localeCompare(a.monthKey));
  }
  if(!mf.locked) mf.locked = true;
  if(!Array.isArray(mf.items)) mf.items = [];
  if(!Array.isArray(mf.weeks)) mf.weeks = [];
  return mf;
}

/* 10) AUTO ARCHIVE */
function autoArchive(){
  const now = new Date();
  const today = todayKey();
  getCurrentWeekFolder(); getCurrentMonthFolder();
  if (store.lastDayCheck === today) return;
  if (store.today.length > 0) {
    const wf = getCurrentWeekFolder();
    const mf = getCurrentMonthFolder();
    store.today.forEach(it => {
      if(!wf.items.find(x => x.id === it.id)) wf.items.push(it);
      if(!store.store.find(x => x.id === it.id)) store.store.unshift(it);
      if(!mf.items.find(x => x.id === it.id)) mf.items.push(it);
      const mwf = mf.weeks.find(w => w.weekStart === wf.weekStart);
      if(mwf){ if(!mwf.items.find(x => x.id === it.id)) mwf.items.push(it); }
      else { mf.weeks.push({ label: wf.label, weekStart: wf.weekStart, items: [it] }); }
    });
    store.today = [];
  }
  if (now.getDate() === 1) {
    const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const prevKey = monthKey(prevMonth);
    const prevWeeks = store.weekly.filter(w => monthKey(new Date(w.weekStart)) === prevKey);
    if (prevWeeks.length > 0) {
      let mf = store.monthly.find(m => m.monthKey === prevKey);
      if (!mf) { mf = { monthKey: prevKey, label: monthLabel(prevMonth), weeks: [], items: [], locked: false }; store.monthly.unshift(mf); }
      if(!Array.isArray(mf.weeks)) mf.weeks = [];
      prevWeeks.forEach(w => {
        if (!mf.weeks.find(mw => mw.weekStart === w.weekStart)) {
          mf.weeks.push({ label: w.label, weekStart: w.weekStart, items: [...w.items] });
        }
      });
      mf.items = mf.weeks.flatMap(w => w.items);
      mf.weeks.sort((a,b) => a.weekStart.localeCompare(b.weekStart));
    }
  }
  store.lastDayCheck = today;
  saveStore();
}

let fsQuestions = [], fsQIndex = 0, fsIndex = 0;

let fsPinching = false, fsPinchStartDist = 0, fsPinchStartScale = 1, fsPinchStartTx = 0, fsPinchStartTy = 0, fsPinchMidX = 0, fsPinchMidY = 0;

function openFsFromCard(listKey, photoIndex){

  const tab = parts[0];
  let sourceList = [];
  if(tab === 'all') sourceList = store.today || [];
  else if(tab === 'weekly') sourceList = store.weekly.flatMap(w => w.items);
  else if(tab === 'monthly') sourceList = store.monthly.flatMap(m => (m.items && m.items.length) ? m.items : m.weeks.flatMap(w => w.items));
  else if(tab === 'store') sourceList = store.store || [];
  else if(tab === 'folder'){
    if(currentFolder){
      if(currentFolder.type === 'weekly'){ const w = store.weekly[currentFolder.key]; if(w) sourceList = w.items; }
      else if(currentFolder.type === 'monthly'){ const m = store.monthly[currentFolder.key]; if(m) sourceList = (m.items && m.items.length) ? m.items : m.weeks.flatMap(w => w.items); }
    }
  } else sourceList = store.today || [];
  const sorted = getSortedList(sourceList);
  const total = sorted.length;
  const questions = sorted.map((q, i) => ({
    qnum: total - i,
    images: [
      q.qImage ? {url:q.qImage, label:'QUESTION'} : null,
      q.myImage ? {url:q.myImage, label:'MY SOLUTION'} : null,
      q.cImage ? {url:q.cImage, label:'CORRECT SOLUTION'} : null
    ].filter(Boolean)
  })).filter(q => q.images.length > 0);
  let qIdx = 0;
  const idx = parseInt(parts[1]);
  if(!isNaN(idx) && idx < questions.length) qIdx = idx;
  openFsFromQuestions(questions, qIdx, photoIndex || 0);
}
function openFsFromQuestions(questions, qIndex, photoIndex){
  fsQuestions = questions.map(q => ({ qnum: q.qnum, images: (q.images || []).filter(x => x && x.url) })).filter(q => q.images.length > 0);
  if(!fsQuestions.length) return;
  fsQIndex = Math.max(0, Math.min(qIndex, fsQuestions.length - 1));
  fsIndex = Math.max(0, Math.min(photoIndex || 0, fsQuestions[fsQIndex].images.length - 1));
  fsResetZoom(); fsShowCurrent();
  document.getElementById('fsViewer').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function fsResetZoom(){ fsScale = 1; fsTx = 0; fsTy = 0; const img = document.getElementById('fsImg'); img.style.transition = ''; img.style.transform = ''; }
function fsApplyTransform(animate){ const img = document.getElementById('fsImg'); img.style.transition = animate ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none'; img.style.transform = `translate(${fsTx}px, ${fsTy}px) scale(${fsScale})`; }
function fsShowCurrent(){
  const q = fsQuestions[fsQIndex];
  const item = q.images[fsIndex];
  const img = document.getElementById('fsImg');
  fsResetZoom(); img.src = item.url;
  document.getElementById('fsCounter').textContent = (fsIndex+1) + ' / ' + q.images.length;
  document.getElementById('fsLabel').textContent = item.label;
  document.getElementById('fsQNum').textContent = 'Q' + q.qnum;
  const pBtn = document.getElementById('fsPreviewBtn');
  if(fsQIndex <= 0){ pBtn.disabled = true; pBtn.style.opacity = '0.35'; } else { pBtn.disabled = false; pBtn.style.opacity = '1'; }
  const nextBtn = document.getElementById('fsNextBtn'); const doneBtn = document.getElementById('fsDoneBtn');
  if(fsQIndex >= fsQuestions.length - 1){ nextBtn.style.display = 'none'; doneBtn.style.display = 'inline-flex'; }
  else { nextBtn.style.display = 'inline-flex'; doneBtn.style.display = 'none'; }
}
function closeFs(){ document.getElementById('fsViewer').classList.remove('show'); document.getElementById('fsImg').src = ''; fsResetZoom(); document.body.style.overflow = ''; }
function fsPrevQuestion(){ if(fsQIndex > 0){ fsQIndex--; fsIndex = 0; fsResetZoom(); fsShowCurrent(); } }
function fsNextQuestion(){ if(fsQIndex < fsQuestions.length - 1){ fsQIndex++; fsIndex = 0; fsResetZoom(); fsShowCurrent(); } }
function fsTouchDist(t1, t2){ const dx=t1.clientX-t2.clientX,dy=t1.clientY-t2.clientY;return Math.hypot(dx,dy); }
(function bindFullscreen(){
  const stage = document.getElementById('fsStage');
  const img = document.getElementById('fsImg');
  stage.addEventListener('touchstart', e => {
    if(e.touches.length === 1){
      fsMovedSinceTouch = false; fsTapStartTime = Date.now();
      fsSwipeStartX = e.touches[0].clientX; fsSwipeStartY = e.touches[0].clientY;
      fsSwipeDeltaX = 0; fsSwipeDeltaY = 0;
      if(fsScale > 1.02){ fsPanning = true; fsPanStartX = fsSwipeStartX; fsPanStartY = fsSwipeStartY; fsPanStartTx = fsTx; fsPanStartTy = fsTy; }
      else { fsSwiping = true; }
    } else if(e.touches.length === 2){
      fsPinching = true; fsSwiping = false; fsPanning = false; fsMovedSinceTouch = true;
      fsPinchStartDist = fsTouchDist(e.touches[0], e.touches[1]);
      fsPinchStartScale = fsScale; fsPinchStartTx = fsTx; fsPinchStartTy = fsTy;
      const rect = stage.getBoundingClientRect();
      fsPinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left - rect.width / 2;
      fsPinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top - rect.height / 2;
    }
  }, {passive:true});
  stage.addEventListener('touchmove', e => {
    if(fsPinching && e.touches.length === 2){
      const dist = fsTouchDist(e.touches[0], e.touches[1]);
      const ratio = dist / fsPinchStartDist;
      let newScale = fsPinchStartScale * ratio;
      newScale = Math.max(1, Math.min(5, newScale));
      const k = newScale / fsPinchStartScale;
      fsTx = fsPinchStartTx * k - fsPinchMidX * (k - 1);
      fsTy = fsPinchStartTy * k - fsPinchMidY * (k - 1);
      fsScale = newScale;
      fsApplyTransform(false); e.preventDefault();
    } else if(fsPanning && e.touches.length === 1){
      const dx = e.touches[0].clientX - fsPanStartX;
      const dy = e.touches[0].clientY - fsPanStartY;
      fsTx = fsPanStartTx + dx; fsTy = fsPanStartTy + dy;
      fsApplyTransform(false); fsMovedSinceTouch = true; e.preventDefault();
    } else if(fsSwiping && e.touches.length === 1){
      fsSwipeDeltaX = e.touches[0].clientX - fsSwipeStartX;
      fsSwipeDeltaY = e.touches[0].clientY - fsSwipeStartY;
      if(Math.abs(fsSwipeDeltaX) > Math.abs(fsSwipeDeltaY) && Math.abs(fsSwipeDeltaX) > 8){
        fsMovedSinceTouch = true;
        img.style.transition = 'none';
        img.style.transform = `translateX(${fsSwipeDeltaX}px)`;
        e.preventDefault();
      }
    }
  }, {passive:false});
  stage.addEventListener('touchend', e => {
    if(e.touches.length === 0){
      if(fsPinching){ fsPinching = false; if(fsScale < 1.05){ fsScale=1;fsTx=0;fsTy=0; } fsApplyTransform(true); fsMovedSinceTouch=false; return; }
      if(fsPanning){ fsPanning = false; fsApplyTransform(true); fsMovedSinceTouch=false; return; }
      if(fsSwiping){
        fsSwiping = false;
        img.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
        const SWIPE_THRESHOLD = 60;
        const q = fsQuestions[fsQIndex];
        if(Math.abs(fsSwipeDeltaX) > SWIPE_THRESHOLD && Math.abs(fsSwipeDeltaX) > Math.abs(fsSwipeDeltaY)){
          const dir = fsSwipeDeltaX > 0 ? 1 : -1;
          if(dir < 0 && fsIndex < q.images.length - 1){
            const stageWidth = stage.getBoundingClientRect().width;
            img.style.transform = `translateX(${-stageWidth}px)`;
            setTimeout(() => { fsIndex++; fsShowCurrent(); }, 240);
          } else if(dir > 0 && fsIndex > 0){
            const stageWidth = stage.getBoundingClientRect().width;
            img.style.transform = `translateX(${stageWidth}px)`;
            setTimeout(() => { fsIndex--; fsShowCurrent(); }, 240);
          } else { img.style.transform = ''; }
        } else {
          img.style.transform = '';
          const duration = Date.now() - fsTapStartTime;
          if(!fsMovedSinceTouch && duration < 300){ if(fsScale > 1.02){ fsScale=1;fsTx=0;fsTy=0; fsApplyTransform(true); } }
        }
      }
      fsMovedSinceTouch = false;
    }
  });
  document.addEventListener('keydown', e => {
    if(!document.getElementById('fsViewer').classList.contains('show')) return;
    if(e.key === 'Escape') closeFs();
    if(e.key === 'ArrowLeft') fsPrevQuestion();
    if(e.key === 'ArrowRight') fsNextQuestion();
  });
})();

/* 15) RENDERERS */
function renderAll(){
  const el=document.getElementById('allList');
  const list = getSortedList(store.today);
  if(!list.length){ el.innerHTML='<div class="card empty smooth-in"><i class="fa-solid fa-sun"></i><br>No questions yet — add one above</div>'; return; }
  el.innerHTML = list.map((m, i) => mistakeCard(m, 'all', i)).join('');
}
function renderWeekly(){
  const el=document.getElementById('weeklyList');
  if(!store.weekly.length){ el.innerHTML='<div class="card empty smooth-in"><i class="fa-solid fa-calendar-week"></i><br>No weekly folders yet</div>'; return; }
  el.innerHTML = store.weekly.map((w, wi) => `
    <div class="folder smooth-in ${w.locked ? 'locked' : ''}" data-fid="w-${wi}" data-folder-type="weekly" data-folder-key="${wi}" data-folder-locked="${w.locked ? '1' : '0'}" onclick="openFolderDetail('weekly', ${wi})">
      <div class="folder-head">
        <i class="fa-solid fa-calendar-week ic" style="color:${w.locked ? '#22c55e' : '#16a34a'}"></i>
        <div class="info"><div class="ttl">${w.label} ${w.locked ? '<i class="fa-solid fa-lock lock"></i>' : ''}</div><div class="sub">${w.weekStart}${w.locked ? ' • CURRENT' : ''}</div></div>
        <span class="cnt">${w.items.length}</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
    </div>`).join('');
}
function renderMonthly(){
  const el=document.getElementById('monthlyList');
  if(!store.monthly.length){ el.innerHTML='<div class="card empty smooth-in"><i class="fa-solid fa-calendar-days"></i><br>No monthly folders yet</div>'; return; }
  el.innerHTML = store.monthly.map((m, mi) => {
    const count = (m.items && m.items.length) ? m.items.length : m.weeks.reduce((s,w)=>s+w.items.length,0);
    return `
    <div class="folder smooth-in ${m.locked ? 'locked' : ''}" data-fid="m-${mi}" data-folder-type="monthly" data-folder-key="${mi}" data-folder-locked="${m.locked ? '1' : '0'}" onclick="openFolderDetail('monthly', ${mi})">
      <div class="folder-head">
        <i class="fa-solid fa-calendar-days ic" style="color:${m.locked ? '#22c55e' : '#f59e0b'}"></i>
        <div class="info"><div class="ttl">${m.label} ${m.locked ? '<i class="fa-solid fa-lock lock"></i>' : ''}</div><div class="sub">${m.weeks.length} weeks${m.locked ? ' • CURRENT' : ''}</div></div>
        <span class="cnt">${count}</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
    </div>`;
  }).join('');
}
function openStore(){ renderStore(); document.getElementById('storeView').classList.remove('hidden'); scrollTo(0,0); }
function closeStore(){ document.getElementById('storeView').classList.add('hidden'); updateStoreCount(); }
function updateStoreCount(){ const c = (store.store||[]).length; const el = document.getElementById('storeCount'); if(el) el.textContent = c + ' question' + (c===1?'':'s') + ' stored'; }
function renderStore(){
  const el = document.getElementById('storeList');
  const list = getSortedList(store.store || []);
  document.getElementById('storeTopCount').textContent = list.length;
  if(!list.length){ el.innerHTML = '<div class="card empty smooth-in"><i class="fa-solid fa-box-open"></i><br>Nothing stored yet</div>'; return; }
  el.innerHTML = list.map((m, i) => mistakeCard(m, 'store', i)).join('');
}
function updateReminder(){
  const t=new Date(); const isMon=t.getDay()===1;
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); const isLast=t.getDate()===last;
  const r=document.getElementById('reminder'); const total=store.today.length;
  if((isMon||isLast)&&total){ r.classList.remove('hidden'); const w=[];if(isMon)w.push('Monday');if(isLast)w.push('Last date'); document.getElementById('remMsg').innerHTML=`<b>${w.join(' + ')}</b> — ${total} practice`; }
  else r.classList.add('hidden');
}

/* 16) EXPORT / IMPORT / CLEAR */
function exportData(){
  const total=store.today.length+store.weekly.reduce((s,w)=>s+w.items.length,0)+store.monthly.reduce((s,m)=>s+((m.items||[]).length || m.weeks.reduce((ss,w)=>ss+w.items.length,0)),0)+(store.store||[]).length;
  if(!total){toast('Empty',1);return}
  const b=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='question-error-book-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('Exported');
}
function importData(){ document.getElementById('importFile').click(); }
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d&&typeof d==='object'&&Array.isArray(d.today)){
        if(confirm('Purana data replace ho jayega?')){
          store=Object.assign({today:[],weekly:[],monthly:[],store:[],lastDayCheck:""},d);
          saveStore(); renderAll(); renderWeekly(); renderMonthly(); updateStoreCount(); toast('Imported');
        }
      } else if(Array.isArray(d)){
        const ids=new Set(store.today.map(m=>m.id));
        d.forEach(m=>{ if(!ids.has(m.id)) store.today.push(m); });
        saveStore(); renderAll(); toast('Imported');
      } else throw 0;
    }catch{ toast('Bad file',1); }
    e.target.value='';
  };
  r.readAsText(f);
};
function clearAll(){
  const total=store.today.length+store.weekly.length+store.monthly.length+(store.store||[]).length;
  if(!total)return;
  if(!confirm('Sab kuch delete?'))return;
  store={today:[],weekly:[],monthly:[],store:[],lastDayCheck:""};
  saveStore(); renderAll(); renderWeekly(); renderMonthly(); updateReminder(); updateStoreCount(); toast('All cleared');
}

/* 17) GLOBAL DELETE */
function performDelete(id){
  const sid = String(id);
  store.today = store.today.filter(x => String(x.id) !== sid);
  store.weekly.forEach(w => { if(Array.isArray(w.items)) w.items = w.items.filter(x => String(x.id) !== sid); });
  store.monthly.forEach(m => {
    if(Array.isArray(m.weeks)){ m.weeks.forEach(w => { if(Array.isArray(w.items)) w.items = w.items.filter(x => String(x.id) !== sid); }); }
    if(Array.isArray(m.items)) m.items = m.items.filter(x => String(x.id) !== sid);
  });
  store.store = store.store.filter(x => String(x.id) !== sid);
  saveStore(); rerenderAll(); toast('Deleted from all sections');
}
function rerenderAll(){
  const active = document.querySelector('.topstrip button.active')?.dataset.tab || 'all';
  if(active === 'all') renderAll();
  else if(active === 'weekly') renderWeekly();
  else if(active === 'monthly') renderMonthly();
  const sv = document.getElementById('storeView');
  if(sv && !sv.classList.contains('hidden')) renderStore();
  const fd = document.getElementById('folderDetail');
  if(fd && fd.classList.contains('show') && currentFolder){ openFolderDetail(currentFolder.type, currentFolder.key); }
  updateReminder(); updateStoreCount();
}

/* 18) SWIPE DELETE QUESTIONS */
let swipeState = null;
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.mistake');
  if(!card) return;
  if(e.target.closest('.ans-toggle-btn') || e.target.closest('button')) return;
  const touch = e.touches[0];
  swipeState = { card, startX: touch.clientX, startY: touch.clientY, deltaX: 0, deltaY: 0, locked: false, direction: null };
}, {passive:true});
document.addEventListener('touchmove', e => {
  if(!swipeState) return;
  const touch = e.touches[0];
  swipeState.deltaX = touch.clientX - swipeState.startX;
  swipeState.deltaY = touch.clientY - swipeState.startY;
  if(!swipeState.locked){
    if(Math.abs(swipeState.deltaX) > 8 || Math.abs(swipeState.deltaY) > 8){
      swipeState.locked = true;
      swipeState.direction = Math.abs(swipeState.deltaX) > Math.abs(swipeState.deltaY) ? 'h' : 'v';
      if(swipeState.direction === 'h'){
        swipeState.card.classList.add('swiping');
        if(!swipeState.card.querySelector('.fire-overlay')){
          const ov = document.createElement('div'); ov.className = 'fire-overlay'; swipeState.card.appendChild(ov);
        }
      }
    }
  }
  if(swipeState.direction === 'h'){
    const dx = Math.min(0, swipeState.deltaX);
    swipeState.card.style.transform = `translateX(${dx}px)`;
    swipeState.card.style.transition = 'none';
    const ov = swipeState.card.querySelector('.fire-overlay');
    if(ov){ ov.style.opacity = Math.min(1, Math.abs(dx)/200) * 0.9; }
    e.preventDefault();
  }
}, {passive:false});
document.addEventListener('touchend', e => {
  if(!swipeState) return;
  const card = swipeState.card; const dx = swipeState.deltaX;
  const wasH = swipeState.direction === 'h'; swipeState = null;
  if(!wasH) return;
  const THRESHOLD = 100;
  if(dx < -THRESHOLD){
    card.classList.add('slide-out-left','fire-burst');
    setTimeout(() => {
      card.style.transition = 'height .3s, margin .3s, padding .3s, opacity .3s';
      card.style.height = '0px'; card.style.marginBottom = '0px'; card.style.paddingTop = '0px'; card.style.paddingBottom = '0px';
      setTimeout(() => { const qid = card.dataset.mistakeId; if(qid) performDelete(qid); }, 320);
    }, 200);
  } else {
    card.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
    card.style.transform = '';
    const ov = card.querySelector('.fire-overlay');
    if(ov){ ov.style.opacity = '0'; }
    setTimeout(() => { card.classList.remove('swiping'); if(ov) ov.remove(); }, 300);
  }
});

/* 19) SWIPE DELETE FOLDERS */
let folderSwipeState = null;
document.addEventListener('touchstart', e => {
  const folder = e.target.closest('.folder');
  if(!folder) return;
  if(e.target.closest('#folderDetail')) return;
  if(e.target.closest('button')) return;
  const touch = e.touches[0];
  folderSwipeState = { folder, startX: touch.clientX, startY: touch.clientY, deltaX: 0, deltaY: 0, locked: false, direction: null };
}, {passive:true});
document.addEventListener('touchmove', e => {
  if(!folderSwipeState) return;
  if(folderSwipeState.folder.dataset.folderLocked === '1') return;
  const touch = e.touches[0];
  folderSwipeState.deltaX = touch.clientX - folderSwipeState.startX;
  folderSwipeState.deltaY = touch.clientY - folderSwipeState.startY;
  if(!folderSwipeState.locked){
    if(Math.abs(folderSwipeState.deltaX) > 8 || Math.abs(folderSwipeState.deltaY) > 8){
      folderSwipeState.locked = true;
      folderSwipeState.direction = Math.abs(folderSwipeState.deltaX) > Math.abs(folderSwipeState.deltaY) ? 'h' : 'v';
      if(folderSwipeState.direction === 'h'){
        folderSwipeState.folder.classList.add('swiping');
        if(!folderSwipeState.folder.querySelector('.fire-overlay')){
          const ov = document.createElement('div'); ov.className = 'fire-overlay'; folderSwipeState.folder.appendChild(ov);
        }
      }
    }
  }
  if(folderSwipeState.direction === 'h'){
    const dx = Math.min(0, folderSwipeState.deltaX);
    folderSwipeState.folder.style.transform = `translateX(${dx}px)`;
    folderSwipeState.folder.style.transition = 'none';
    const ov = folderSwipeState.folder.querySelector('.fire-overlay');
    if(ov){ ov.style.opacity = Math.min(1, Math.abs(dx)/200) * 0.9; }
    e.preventDefault();
  }
}, {passive:false});
document.addEventListener('touchend', e => {
  if(!folderSwipeState) return;
  const folder = folderSwipeState.folder; const dx = folderSwipeState.deltaX;
  const wasH = folderSwipeState.direction === 'h';
  const isLocked = folder.dataset.folderLocked === '1';
  folderSwipeState = null;
  if(!wasH) return;
  if(isLocked){
    folder.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
    folder.style.transform = '';
    const ov = folder.querySelector('.fire-overlay');
    if(ov){ ov.style.opacity = '0'; }
    setTimeout(() => { folder.classList.remove('swiping'); if(ov) ov.remove(); }, 300);
    if(Math.abs(dx) > 30) toast('Locked folder delete nahi ho sakta', 1);
    return;
  }
  const THRESHOLD = 100;
  if(dx < -THRESHOLD){
    folder.classList.add('slide-out-left','fire-burst');
    setTimeout(() => {
      folder.style.transition = 'height .3s, margin .3s, padding .3s, opacity .3s';
      folder.style.height = '0px'; folder.style.marginBottom = '0px'; folder.style.paddingTop = '0px'; folder.style.paddingBottom = '0px';
      setTimeout(() => {
        const ftype = folder.dataset.folderType;
        const fkey = parseInt(folder.dataset.folderKey);
        if(ftype && !isNaN(fkey)) performFolderDelete(ftype, fkey);
      }, 320);
    }, 200);
  } else {
    folder.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
    folder.style.transform = '';
    const ov = folder.querySelector('.fire-overlay');
    if(ov){ ov.style.opacity = '0'; }
    setTimeout(() => { folder.classList.remove('swiping'); if(ov) ov.remove(); }, 300);
  }
});
function performFolderDelete(type, key){
  if(type === 'weekly'){
    if(store.weekly[key] && store.weekly[key].locked){ toast('Locked folder delete nahi ho sakta',1); return; }
    store.weekly.splice(key, 1);
  } else if(type === 'monthly'){
    if(store.monthly[key] && store.monthly[key].locked){ toast('Locked folder delete nahi ho sakta',1); return; }
    store.monthly.splice(key, 1);
  }
  saveStore();
  const active = document.querySelector('.topstrip button.active')?.dataset.tab || 'all';
  if(active === 'weekly') renderWeekly();
  else if(active === 'monthly') renderMonthly();
  toast('Folder deleted');
}

/* 20) INIT */
function revealShell(shellId){
  const shell = document.getElementById(shellId);
  if (shell) shell.classList.add('loaded');
}
function revealAll(){
  document.body.classList.remove('app-loading');
  revealShell('shell-all');
  revealShell('shell-weekly');
  revealShell('shell-monthly');
}

getCurrentWeekFolder();
getCurrentMonthFolder();
saveStore();
autoArchive();
updateReminder();
renderAll();
renderWeekly();
renderMonthly();
updateStoreCount();

requestAnimationFrame(() => {
  setTimeout(() => {
    revealAll();
  }, 400);
});

setInterval(()=>{ autoArchive(); updateReminder(); }, 60000);
